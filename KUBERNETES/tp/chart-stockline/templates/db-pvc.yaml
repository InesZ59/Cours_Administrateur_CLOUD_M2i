{{- if .Values.db.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  labels:
    {{- include "stockline.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
  {{- with .Values.db.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
