{{- if .Values.db.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    {{- include "stockline.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.auth.user | quote }}
  POSTGRES_PASSWORD: {{ required "db.auth.password est obligatoire : --set db.auth.password=..." .Values.db.auth.password | quote }}
  POSTGRES_DB: {{ .Values.db.auth.database | quote }}
{{- end }}
