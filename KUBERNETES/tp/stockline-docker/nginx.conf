# Configuration nginx du service `front` de StockLine.
# Rôles : 1) servir la page statique, 2) reverse proxy /api/ -> service api.
# Montée dans le conteneur sur /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    # 1) Le front statique (front/index.html monté en volume)
    root /usr/share/nginx/html;
    index index.html;

    # 2) Reverse proxy vers l'API.
    # `api` est le nom du service Compose : nginx le résout via le DNS
    # interne du réseau Compose.
    # Le / final de proxy_pass RETIRE le préfixe /api :
    #   GET /api/produits  ->  GET http://api:8000/produits
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
