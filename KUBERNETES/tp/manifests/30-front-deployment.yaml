# Front statique StockLine : nginx officiel + page HTML montée depuis un
# ConfigMap (l'équivalent Kubernetes du bind mount du J3).
# Pas de reverse proxy ici : le routage /api est porté par l'ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: stockline
  labels:
    app.kubernetes.io/part-of: stockline
    app: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        app.kubernetes.io/part-of: stockline
    spec:
      containers:
        - name: front
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: front-html    # la clé "index.html" devient un fichier index.html
