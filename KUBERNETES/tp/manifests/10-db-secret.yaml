# Secret : identifiants PostgreSQL.
# ⚠️ stringData accepte du texte clair : Kubernetes l'encode en base64 au stockage.
#    base64 N'EST PAS du chiffrement — quiconque lit le Secret lit le mot de passe.
#    En production : chiffrement etcd au repos, RBAC strict, ou secrets externes
#    (AWS Secrets Manager + External Secrets Operator).
# En formation le mot de passe est généré par apprenant :
#   kubectl create secret generic db-credentials -n stockline \
#     --from-literal=POSTGRES_USER=stockline \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=POSTGRES_DB=stockline --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: stockline
  labels:
    app.kubernetes.io/part-of: stockline
type: Opaque
stringData:
  POSTGRES_USER: stockline
  POSTGRES_PASSWORD: "ChangezMoi-f4c3b00c"   # valeur de TP uniquement, à régénérer
  POSTGRES_DB: stockline
