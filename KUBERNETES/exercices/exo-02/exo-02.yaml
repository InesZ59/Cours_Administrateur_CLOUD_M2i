apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-02-nginx-dep
spec:
  selector:
    matchLabels:
      app: exo-02-nginx-pod
  template:
    metadata:
      labels:
        app: exo-02-nginx-pod
    spec:
      containers:
        - name: exo-02-nginx-container
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-02-2048-dep
spec:
  selector:
    matchLabels:
      app: exo-02-2048-pod
  template:
    metadata:
      labels:
        app: exo-02-2048-pod
    spec:
      containers:
        - name: exo-02-nginx-container
          image: quchaonet/2048
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-02-api-dep
spec:
  selector:
    matchLabels:
      app: exo-02-api-pod
  template:
    metadata:
      labels:
        app: exo-02-api-pod
    spec:
      containers:
        - name: exo-02-nginx-container
          image: qqchose/api
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: exo-02-nginx-svc
spec:
  selector:
    app: exo-02-nginx-pod
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: exo-02-2048-svc
spec:
  selector:
    app: exo-02-2048-pod
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: exo-02-api-svc
spec:
  selector:
    app: exo-02-api-pod
  ports:
    - port: 3000
      targetPort: 3000
