apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-02-nginx-dep
spec:
  selector:
    matchLabels:
      app: exo-02-nginx-pod
  template:
    metadata:
      labels:
        app: exo-02-nginx-pod
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: country
                    operator: "In"
                    values: ["france"]
      tolerations:
        - effect: NoExecute
          key: country
          value: france
          operator: Equal
      containers:
        - name: exo-02-nginx-container
          image: nginx
          ports:
            - containerPort: 80
