<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments :: head(${produit.id} == null ? 'Nouveau produit' : 'Modifier')}"></head>
<body>
<header th:replace="~{fragments :: entete}"></header>

<main class="contenu">
    <h1 th:text="${produit.id} == null ? 'Nouveau produit' : 'Modifier le produit'">Produit</h1>

    <form th:action="@{/produits}" th:object="${produit}" method="post" class="formulaire">
        <input type="hidden" th:field="*{id}">

        <label>Nom
            <input type="text" th:field="*{nom}" maxlength="100">
            <span class="erreur" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </label>

        <label>Description
            <input type="text" th:field="*{description}" maxlength="255">
        </label>

        <label>Prix (€)
            <input type="number" step="0.01" min="0" th:field="*{prix}">
            <span class="erreur" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}"></span>
        </label>

        <label>Quantité en stock
            <input type="number" min="0" th:field="*{quantite}">
            <span class="erreur" th:if="${#fields.hasErrors('quantite')}" th:errors="*{quantite}"></span>
        </label>

        <div class="boutons">
            <button type="submit" class="bouton">Enregistrer</button>
            <a th:href="@{/produits}">Annuler</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
