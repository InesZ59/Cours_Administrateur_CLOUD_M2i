spring.application.name=produits
server.port=8080

# Connexion à la base : variables d'environnement fournies par la définition de tâche ECS
# (valeurs par défaut = PostgreSQL local du docker-compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:produits}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Création / mise à jour automatique du schéma (suffisant pour une démo ; en production : Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health check utilisé par l'ALB : /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Infos affichées dans le pied de page
app.version=${APP_VERSION:dev}
app.couleur=${APP_COULEUR:#2563eb}
app.db-host=${DB_HOST:localhost}

# Logs lisibles dans CloudWatch
logging.level.com.formation=INFO
server.servlet.session.tracking-modes=cookie
