# Server
server.port=${PORT:5000}
spring.application.name=rickandmorty-thymeleaf

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# API Rick and Morty (publique, pas d'auth requise)
rickandmorty.api.base-url=https://rickandmortyapi.com/api
rickandmorty.api.timeout-seconds=10

# Actuator (health check pour App Runner)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logs
logging.level.root=INFO
logging.level.com.utopios.rickandmorty=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
