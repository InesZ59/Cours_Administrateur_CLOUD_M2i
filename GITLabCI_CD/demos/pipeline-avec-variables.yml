variables:
  VAR_LOCALE: "Broccoli"

job-avec-variables-env:
  script:
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_COMMIT_SHORT_SHA
    - echo $CI_REGISTRY
    - echo $CI_REGISTRY_USER
    - echo $CI_REGISTRY_PASSWORD
    - echo $CI_REGISTRY_IMAGE

job-avec-variables-groupe_projet:
  script:
    - echo $VAR_GRP
    - echo $VAR_CACHEE
    - echo $VAR_GRP_SECRETE | base64 -d
    - echo $VAR_GRP_FILE
    - cat $VAR_GRP_FILE
    - echo $VAR_PJT

job-avec-variables-pipeline:
  script:
    - echo $VAR_LOCALE
