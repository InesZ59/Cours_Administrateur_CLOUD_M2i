stages:
  - build
  - test
  - packaging
  - upload
  - deploy

build-app:
  stage: build
  image: node:26.9-alpine3.24
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/

unit-testing:
  dependencies: []
  image: node:26.9-alpine3.24
  stage: test
  script:
    - npm ci
    - npm run test
  artifacts:
    paths:
      - reports/html/
    reports:
      junit: reports/junit.xml

check-vulnerabilities:
  dependencies: []
  image: 
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  stage: test
  script:
    - trivy fs --severity HIGH,CRITICAL -f json -o dependencies-vulnerabilities.json .
  artifacts:
    paths:
      - dependencies-vulnerabilities.json

# Exercice S3 Pipeline
upload-sur-s3:
  stage: upload
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  dependencies: ["unit-testing", "check-vulnerabilities"]
  before_script:
    - yum install -y tar gzip
  script:
    - mkdir -p backup
    - cp -r dependencies-vulnerabilities.json backup/
    - cp -r reports/html/ backup/
    - tar -czvf ${ARCHIVE_NAME} backup/
    - aws s3 cp ${ARCHIVE_NAME} s3://${AWS_S3_NAME}/${CI_PROJECT_NAME}/${CI_COMMIT_SHORT_SHA}/${ARCHIVE_NAME}
    - aws s3 ls ${ARCHIVE_NAME} s3://${AWS_S3_NAME}/${CI_PROJECT_NAME}/${CI_COMMIT_SHORT_SHA}/ | grep -i ${ARCHIVE_NAME}

.packaging-app:
  dependencies: []
  image: docker:29
  services:
    - docker:29-dind
  stage: packaging
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA  .
    - docker push -a $CI_REGISTRY_IMAGE

# Exercice ECR
packaging-aws:
  stage: packaging
  image: 
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_ECR_IMAGE_NAME: "m2i-test-formateur"
  before_script:
    - yum install -y docker
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export AWS_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_REGISTRY}
  script:
    - docker build -t ${AWS_REGISTRY}/${AWS_ECR_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker push ${AWS_REGISTRY}/${AWS_ECR_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

.deploy-aws-ec2:
  stage: deploy
  image: alpine:3.24.2
  before_script:
    - apk update
    - apk add openssh-client
    - mkdir -p ~/.ssh/
    - echo $PRIVATE_KEY_B64 | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo $KNOWN_HOSTS_B64 | base64 -d > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_rsa ${EC2_USER}@${EC2_PUBLIC_IP} "echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin && docker pull $CI_REGISTRY_IMAGE:latest && docker stop $DOCKER_CONTAINER_NAME || true && docker rm $DOCKER_CONTAINER_NAME || true && docker run -d --name $DOCKER_CONTAINER_NAME --restart always -p 80:80 $CI_REGISTRY_IMAGE:latest"