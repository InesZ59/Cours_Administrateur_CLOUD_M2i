variables:
  MVN_CLI_OPTS: "-B -Dmaven.repo.local=.m2/repository -Dmaven.test.failure.ignore=false"

default:
  image: maven:3.9.8-eclipse-temurin-21
  tags:
    - gitlab-org-docker

stages:
  - build
  - test

compil-app:
  stage: build
  script:
    - mvn $MVN_CLI_OPTS clean install -DskipTests

test-app:
  stage: test
  script:
    - mvn $MVN_CLI_OPTS verify
  artifacts:
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml
