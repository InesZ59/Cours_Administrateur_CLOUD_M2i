# Workflow pour projet Java Spring Boot - API de base sans sécurité

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  MAVEN_CLI_OPTS: "-B -Dmaven.repo.local=.m2/repository -Dmaven.test.failure.ignore=false"

cache:
  key: "${CI_COMMIT_SHORT_SHA}-maven"
  paths:
    - .m2/repository
    - target/

stages:
  - build
  - test
  - scan_vulnerability
  - code_quality

build_app:
  stage: build
  image: maven:3.9.8-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests

test_app:
  stage: test
  image: maven:3.9.8-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS verify
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml

scan_vulnerabilities:
  stage: scan_vulnerability
  image:
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL -f json -o dependencies_vulnerabilities.json .
  artifacts:
    paths:
      - dependencies_vulnerabilities.json

sonarcloud-check:
  stage: code_quality
  image: maven:3.9.8-eclipse-temurin-21
  cache:
    key: "${CI_JOB_NAME}-sonar"
    paths:
      - .sonar/cache
  script:
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar -Dsonar.projectKey=formations6854437_project-demo-ecole-it
#  rules:
#    - if : "$CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH"
