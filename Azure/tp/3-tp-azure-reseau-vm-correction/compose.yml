# VM vm-db (10.0.3.4) — sous-réseau snet-db
# Lancé depuis la racine du projet (dossier contenant db/init.sql et .env)
services:
  db:
    image: mysql:8.4
    container_name: tp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"   # filtré par le NSG : seul snet-back (10.0.2.0/24) est autorisé
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db-data:
