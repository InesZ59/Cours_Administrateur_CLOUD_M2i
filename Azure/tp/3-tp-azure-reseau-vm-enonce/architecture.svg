<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d00"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c2d91"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="#ffffff"/>

  <!-- Titre -->
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2733">TP Azure – Application 3-tiers (Front / API / MySQL) sur 3 VM et 3 sous-réseaux</text>

  <!-- Acteurs externes -->
  <g>
    <rect x="25" y="285" width="140" height="70" rx="10" fill="#f3f2f1" stroke="#605e5c"/>
    <text x="95" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2733">Utilisateur</text>
    <text x="95" y="337" text-anchor="middle" font-size="12" fill="#605e5c">navigateur web</text>

    <rect x="25" y="150" width="140" height="70" rx="10" fill="#fff8e1" stroke="#8a6d00"/>
    <text x="95" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2733">Admin</text>
    <text x="95" y="202" text-anchor="middle" font-size="12" fill="#605e5c">poste local (az, ssh)</text>
  </g>

  <!-- Région / RG -->
  <rect x="205" y="55" width="975" height="665" rx="14" fill="#f5f9fd" stroke="#0078d4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="225" y="80" font-size="14" font-weight="600" fill="#0063b1">Azure · France Central · Resource group : rg-tp-3tiers</text>

  <!-- VNet -->
  <rect x="245" y="95" width="915" height="490" rx="12" fill="#e8f1fb" stroke="#0078d4" stroke-width="2"/>
  <text x="265" y="120" font-size="14" font-weight="700" fill="#0063b1">VNet vnet-tp · 10.0.0.0/16</text>

  <!-- ============ SUBNET FRONT ============ -->
  <rect x="265" y="135" width="280" height="430" rx="10" fill="#ffffff" stroke="#0078d4"/>
  <text x="280" y="158" font-size="14" font-weight="700" fill="#1b2733">snet-front</text>
  <text x="280" y="176" font-size="12" fill="#605e5c">10.0.1.0/24</text>
  <rect x="440" y="145" width="95" height="24" rx="12" fill="#fde7e9" stroke="#d13438"/>
  <text x="487" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#a4262c">nsg-front</text>

  <rect x="285" y="245" width="240" height="175" rx="8" fill="#eef5fc" stroke="#005a9e"/>
  <text x="300" y="268" font-size="14" font-weight="700" fill="#1b2733">vm-front</text>
  <text x="300" y="286" font-size="12" fill="#605e5c">Ubuntu 24.04 · 10.0.1.4</text>
  <rect x="300" y="300" width="210" height="100" rx="6" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="315" y="322" font-size="13" font-weight="700" fill="#0b6aa2">🐳 tp-frontend</text>
  <text x="315" y="342" font-size="12" fill="#1b2733">Python Flask + gunicorn</text>
  <text x="315" y="360" font-size="12" fill="#1b2733">port 80 → 8080</text>
  <text x="315" y="380" font-size="11" fill="#605e5c">BACKEND_URL=10.0.2.4:5000</text>

  <text x="280" y="455" font-size="12" font-weight="700" fill="#a4262c">Règles entrantes</text>
  <text x="280" y="475" font-size="12" fill="#1b2733">✔ 80   ← Internet</text>
  <text x="280" y="493" font-size="12" fill="#1b2733">✔ 22   ← IP de l'admin</text>
  <text x="280" y="511" font-size="12" fill="#1b2733">✖ tout le reste (défaut)</text>
  <text x="280" y="545" font-size="11" fill="#605e5c">Seule VM avec IP publique</text>

  <!-- IP publique -->
  <rect x="215" y="296" width="62" height="48" rx="8" fill="#0078d4"/>
  <text x="246" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">IP</text>
  <text x="246" y="332" text-anchor="middle" font-size="10" fill="#ffffff">publique</text>

  <!-- ============ SUBNET BACK ============ -->
  <rect x="565" y="135" width="280" height="430" rx="10" fill="#ffffff" stroke="#0078d4"/>
  <text x="580" y="158" font-size="14" font-weight="700" fill="#1b2733">snet-back</text>
  <text x="580" y="176" font-size="12" fill="#605e5c">10.0.2.0/24</text>
  <rect x="740" y="145" width="95" height="24" rx="12" fill="#fde7e9" stroke="#d13438"/>
  <text x="787" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#a4262c">nsg-back</text>

  <rect x="585" y="245" width="240" height="175" rx="8" fill="#eef5fc" stroke="#005a9e"/>
  <text x="600" y="268" font-size="14" font-weight="700" fill="#1b2733">vm-back</text>
  <text x="600" y="286" font-size="12" fill="#605e5c">Ubuntu 24.04 · 10.0.2.4</text>
  <rect x="600" y="300" width="210" height="100" rx="6" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="615" y="322" font-size="13" font-weight="700" fill="#0b6aa2">🐳 tp-backend</text>
  <text x="615" y="342" font-size="12" fill="#1b2733">API Python Flask (REST)</text>
  <text x="615" y="360" font-size="12" fill="#1b2733">port 5000</text>
  <text x="615" y="380" font-size="11" fill="#605e5c">DB_HOST=10.0.3.4</text>

  <text x="580" y="455" font-size="12" font-weight="700" fill="#a4262c">Règles entrantes</text>
  <text x="580" y="475" font-size="12" fill="#1b2733">✔ 5000 ← 10.0.1.0/24 (front)</text>
  <text x="580" y="493" font-size="12" fill="#1b2733">✔ 22   ← 10.0.1.0/24 (rebond)</text>
  <text x="580" y="511" font-size="12" fill="#1b2733">✖ 4000 Deny VirtualNetwork</text>
  <text x="580" y="545" font-size="11" fill="#605e5c">Pas d'IP publique</text>

  <!-- ============ SUBNET DB ============ -->
  <rect x="865" y="135" width="280" height="430" rx="10" fill="#ffffff" stroke="#0078d4"/>
  <text x="880" y="158" font-size="14" font-weight="700" fill="#1b2733">snet-db</text>
  <text x="880" y="176" font-size="12" fill="#605e5c">10.0.3.0/24</text>
  <rect x="1040" y="145" width="95" height="24" rx="12" fill="#fde7e9" stroke="#d13438"/>
  <text x="1087" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#a4262c">nsg-db</text>

  <rect x="885" y="245" width="240" height="175" rx="8" fill="#eef5fc" stroke="#005a9e"/>
  <text x="900" y="268" font-size="14" font-weight="700" fill="#1b2733">vm-db</text>
  <text x="900" y="286" font-size="12" fill="#605e5c">Ubuntu 24.04 · 10.0.3.4</text>
  <rect x="900" y="300" width="210" height="100" rx="6" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="915" y="322" font-size="13" font-weight="700" fill="#0b6aa2">🐳 tp-db</text>
  <text x="915" y="342" font-size="12" fill="#1b2733">MySQL 8.4</text>
  <text x="915" y="360" font-size="12" fill="#1b2733">port 3306</text>
  <text x="915" y="380" font-size="11" fill="#605e5c">volume docker db-data</text>

  <text x="880" y="455" font-size="12" font-weight="700" fill="#a4262c">Règles entrantes</text>
  <text x="880" y="475" font-size="12" fill="#1b2733">✔ 3306 ← 10.0.2.0/24 (API)</text>
  <text x="880" y="493" font-size="12" fill="#1b2733">✔ 22   ← 10.0.1.0/24 (rebond)</text>
  <text x="880" y="511" font-size="12" fill="#1b2733">✖ 4000 Deny VirtualNetwork</text>
  <text x="880" y="545" font-size="11" fill="#605e5c">Pas d'IP publique</text>

  <!-- ============ FLUX APPLICATIFS ============ -->
  <line x1="165" y1="320" x2="213" y2="320" stroke="#1b2733" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="189" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#1b2733">HTTP</text>
  <line x1="277" y1="320" x2="298" y2="320" stroke="#1b2733" stroke-width="2.5" marker-end="url(#arr)"/>

  <line x1="510" y1="350" x2="598" y2="350" stroke="#1b2733" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="525" y="355" width="60" height="18" rx="4" fill="#ffffff"/>
  <text x="555" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#1b2733">:5000</text>

  <line x1="810" y1="350" x2="898" y2="350" stroke="#1b2733" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="825" y="355" width="60" height="18" rx="4" fill="#ffffff"/>
  <text x="855" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#1b2733">:3306</text>

  <!-- ============ SSH ADMIN (rebond) ============ -->
  <path d="M165,185 L405,185 L405,243" fill="none" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="190" y="235" font-size="11" font-weight="600" fill="#8a6d00">SSH :22</text>
  <path d="M440,245 L440,210 L1005,210 L1005,243" fill="none" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <path d="M705,210 L705,243" fill="none" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <rect x="740" y="201" width="190" height="18" rx="4" fill="#ffffff"/>
  <text x="835" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#8a6d00">SSH rebond (ssh -J vm-front)</text>

  <!-- ============ NAT GATEWAY ============ -->
  <path d="M705,565 L705,620 L780,620" fill="none" stroke="#5c2d91" stroke-width="2" marker-end="url(#arrN)"/>
  <path d="M1005,565 L1005,620 L962,620" fill="none" stroke="#5c2d91" stroke-width="2" marker-end="url(#arrN)"/>
  <rect x="782" y="598" width="178" height="46" rx="8" fill="#f3ecfa" stroke="#5c2d91"/>
  <text x="871" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#5c2d91">NAT Gateway</text>
  <text x="871" y="635" text-anchor="middle" font-size="11" fill="#5c2d91">natgw-tp + pip-natgw</text>
  <line x1="871" y1="644" x2="871" y2="690" stroke="#5c2d91" stroke-width="2" marker-end="url(#arrN)"/>
  <text x="882" y="680" font-size="11" fill="#5c2d91">Sortie Internet uniquement (apt, docker pull, pip)</text>

  <!-- Légende -->
  <g font-size="12" fill="#1b2733">
    <text x="225" y="618" font-weight="700">Légende</text>
    <line x1="225" y1="640" x2="265" y2="640" stroke="#1b2733" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="275" y="644">Flux applicatif</text>
    <line x1="225" y1="662" x2="265" y2="662" stroke="#8a6d00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <text x="275" y="666">Administration SSH</text>
    <line x1="225" y1="684" x2="265" y2="684" stroke="#5c2d91" stroke-width="2" marker-end="url(#arrN)"/>
    <text x="275" y="688">Sortant Internet</text>
    <rect x="420" y="630" width="18" height="14" rx="3" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
    <text x="446" y="642">Conteneur Docker</text>
    <rect x="420" y="652" width="18" height="14" rx="7" fill="#fde7e9" stroke="#d13438"/>
    <text x="446" y="664">NSG associé au sous-réseau</text>
  </g>
</svg>
