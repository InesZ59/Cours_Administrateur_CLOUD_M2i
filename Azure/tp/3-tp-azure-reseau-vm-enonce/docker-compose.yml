# Test local de l'application 3-tiers.
# Deux réseaux Docker simulent la segmentation Azure :
#   - front ne voit que l'API (réseau "front-back")
#   - l'API voit le front ET la BDD
#   - la BDD ne voit que l'API (réseau "back-db")
# Seul le front est publié sur l'hôte (http://localhost:8080).

services:
  db:
    image: mysql:8.4
    container_name: tp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tpdb}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [back-db]

  backend:
    build: ./backend
    container_name: tp-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tpdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
    depends_on:
      db:
        condition: service_healthy
    networks: [front-back, back-db]

  frontend:
    build: ./frontend
    container_name: tp-frontend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8082:8080"
    depends_on: [backend]
    networks: [front-back]

networks:
  front-back:
  back-db:

volumes:
  db-data:
